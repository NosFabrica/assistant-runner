name: build

# Every branch push builds, tests and pushes an image, as brainstorm_server's CI does:
# staging pins one of those tags (brainstorm-k8s `docs/staging-workflow.md`).
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # The Postgres the key-read and lock tests run against. Nothing else in the build
    # talks to a network service: relays and task services are fakes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner_test
          POSTGRES_PASSWORD: runner_test
          POSTGRES_DB: runner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Read by the test fixture (runner/src/test/.../TestPostgres.kt) when it can't start a
      # cluster of its own. A superuser: the fixture creates a database per test class, and roles.
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/runner_test
      TEST_DATABASE_USER: runner_test
      TEST_DATABASE_PASSWORD: runner_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      # `build` is compile + test + spotlessCheck.
      - name: Build, test and check formatting
        run: ./gradlew build --no-daemon --console=plain

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn

  image:
    name: Build and push image
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Compute lowercase image name
        id: img
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
